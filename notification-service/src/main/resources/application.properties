#Spring configuration
spring.application.name=notification-service
#to not collide with core-api port
server.port=8081

#Variables
app.company.email=jwarys.carrentalapi@gmail.com

#RabitMQ configuration
spring.rabbitmq.port = 5672
spring.rabbitmq.host = localhost
spring.rabbitmq.listener.simple.retry.enabled = true
spring.rabbitmq.listener.simple.retry.max-attempts = 5
spring.rabbitmq.listener.simple.retry.initial-interval = 1000ms

#Mailhog configuration
spring.mail.host = localhost
spring.mail.port = 1025
spring.mail.properties.mail.smtp.auth=false

#Postgres configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notification_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:testPassword}
spring.datasource.driver-class-name=org.postgresql.Driver

#JPA Configuration
spring.jpa.hibernate.ddl-auto=validate

#Flyway configuration
spring.flyway.table=notification_schema_history