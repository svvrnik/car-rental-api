version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: car_rental_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testPassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
  minio:
    image: minio/minio
    container_name: car_rental_minio
    environment:
      - MINIO_ROOT_USER=admin123
      - MINIO_ROOT_PASSWORD=password123
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
  rabbitmq:
    image: rabbitmq:4.3.3-management
    container_name: car_rental_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
  mailhog:
    image: mailhog/mailhog
    container_name: car_rental_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  postgres_data:
  minio_data: